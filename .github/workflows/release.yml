name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check-version:
    name: Check Version Consistency
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get package.json version
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "package.json version: $VERSION"

      - name: Get release tag version
        id: tag-version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "Release tag: $RELEASE_TAG"

          # Remove 'release/' prefix if present
          TAG_VERSION="${RELEASE_TAG#release/}"
          # Remove 'v' prefix if present
          TAG_VERSION="${TAG_VERSION#v}"

          echo "tag_version=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "Tag version: $TAG_VERSION"

      - name: Verify version consistency
        env:
          PACKAGE_VERSION: ${{ steps.get-version.outputs.version }}
          TAG_VERSION: ${{ steps.tag-version.outputs.tag_version }}
        run: |
          echo "Verifying versions:"
          echo "  package.json: $PACKAGE_VERSION"
          echo "  Release tag:  $TAG_VERSION"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: Version mismatch!"
            echo "  package.json has version $PACKAGE_VERSION"
            echo "  but release tag is $TAG_VERSION"
            echo "Please ensure package.json version matches the release tag."
            exit 1
          fi

          echo "✓ Version check passed: $PACKAGE_VERSION"

  build-windows:
    name: Build Windows
    needs: check-version
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows app
        run: npm run build:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/*.exe
          retention-days: 7

      - name: Upload to release
        run: |
          $files = Get-ChildItem -Path dist -Filter *.exe
          if ($files.Count -eq 0) {
            Write-Error "No .exe artifact found in dist"
            exit 1
          }
          foreach ($file in $files) {
            gh release upload $env:RELEASE_TAG $file.FullName --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}

  build-macos:
    name: Build macOS
    needs: check-version
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Validate macOS signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for secret_name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::$secret_name is not configured"
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build, sign, and notarize macOS app
        run: npm run build:mac -- --config electron-builder.release.yml
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # DMG のファイル名は electron-builder.release.yml の dmg.artifactName に対応する。
      # 以降のステップはこの output だけを参照し、パスの二重定義を避ける。
      - name: Resolve DMG path
        id: dmg
        env:
          RELEASE_VERSION: ${{ needs.check-version.outputs.version }}
        run: echo "path=dist/tell-${RELEASE_VERSION}-universal-mac.dmg" >> "$GITHUB_OUTPUT"

      - name: Verify macOS DMG contents
        shell: bash
        env:
          DMG_PATH: ${{ steps.dmg.outputs.path }}
        run: |
          set -euo pipefail

          MOUNT_POINT="$(mktemp -d)"
          MOUNTED=0

          cleanup() {
            if [ "$MOUNTED" = 1 ]; then
              hdiutil detach "$MOUNT_POINT" || true
            fi
            rmdir "$MOUNT_POINT" || true
          }
          trap cleanup EXIT

          test -f "$DMG_PATH"
          hdiutil attach "$DMG_PATH" -readonly -nobrowse -mountpoint "$MOUNT_POINT"
          MOUNTED=1

          APP_PATH="$MOUNT_POINT/tell.app"
          test -d "$APP_PATH"
          test -L "$MOUNT_POINT/Applications"
          test "$(readlink "$MOUNT_POINT/Applications")" = "/Applications"

          ARCHS="$(lipo -archs "$APP_PATH/Contents/MacOS/tell")"
          for arch in x86_64 arm64; do
            if [[ " $ARCHS " != *" $arch "* ]]; then
              echo "::error::Missing $arch architecture: $ARCHS"
              exit 1
            fi
          done

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --verbose --type exec "$APP_PATH"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: ${{ steps.dmg.outputs.path }}
          compression-level: 0
          retention-days: 7

      - name: Upload to release
        run: gh release upload "$RELEASE_TAG" "$DMG_PATH" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DMG_PATH: ${{ steps.dmg.outputs.path }}
