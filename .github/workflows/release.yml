name: Release

# 起動経路は 3 つ。
# - push: リリース PR のマージで package.json のバージョンが上がったとき。
#   Draft Release を作り、全 OS の成果物をアップロードしてから公開する
# - workflow_dispatch: 失敗した Draft を main の最新コミットで作り直す
# - release: 手動で公開した Release に成果物をアップロードする（従来の経路）
# ビルドジョブは書き込み権限を持たず、Release への書き込みは npm ci を実行しない
# create-release / upload-release だけが行う。

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  create-release:
    name: Resolve Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Release への書き込み（Draft の作成・付け替え、アップロード・公開）を直列にする。
    # upload-release と同じグループにして、確認から公開までの間に付け替えが入らないようにする。
    concurrency:
      group: release-write
      cancel-in-progress: false
    outputs:
      build: ${{ steps.resolve.outputs.build }}
      mode: ${{ steps.resolve.outputs.mode }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve release
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          RELEASES_FILE: ${{ runner.temp }}/releases.json
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = release ]; then
            {
              echo "mode=event"
              echo "tag=$EVENT_TAG"
              echo "build=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          export VERSION
          VERSION=$(node -p "require('./package.json').version")
          export PREVIOUS_VERSION=''
          if [ "$EVENT_NAME" = push ]; then
            export MODE=push
            PREVIOUS_VERSION=$(gh api "repos/$REPO/contents/package.json?ref=$BEFORE" --jq .content \
              | base64 --decode | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          else
            if [ "$REF" != refs/heads/main ]; then
              echo "::error::Run this workflow from the main branch."
              exit 1
            fi
            export MODE=dispatch
          fi

          gh api --paginate --slurp "repos/$REPO/releases" > "$RELEASES_FILE"
          node .github/scripts/release-cli.mjs resolve
          echo "mode=draft" >> "$GITHUB_OUTPUT"

      - name: Create or retarget draft
        if: steps.resolve.outputs.action == 'create' || steps.resolve.outputs.action == 'retarget'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ACTION: ${{ steps.resolve.outputs.action }}
          TAG: ${{ steps.resolve.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.resolve.outputs.previous_tag }}
          SHA: ${{ github.sha }}
          NOTES_FILE: ${{ runner.temp }}/notes.md
        run: |
          set -euo pipefail
          # 比較元を明示してノートを生成する（Draft はタグを持たないため target で範囲を決める）。
          # prepare-release.yml のプレビューと同じ引数で生成する。
          NOTES_ARGS=(-f tag_name="$TAG" -f target_commitish="$SHA")
          if [ -n "$PREVIOUS_TAG" ]; then
            NOTES_ARGS+=(-f previous_tag_name="$PREVIOUS_TAG")
          fi
          gh api "repos/$GH_REPO/releases/generate-notes" "${NOTES_ARGS[@]}" --jq .body > "$NOTES_FILE"

          if [ "$ACTION" = create ]; then
            gh release create "$TAG" --draft --target "$SHA" --title "$TAG" --notes-file "$NOTES_FILE"
          else
            gh release edit "$TAG" --target "$SHA" --notes-file "$NOTES_FILE"
          fi

  check-version:
    name: Check Version Consistency
    needs: create-release
    if: needs.create-release.outputs.build == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Get package.json version
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "package.json version: $VERSION"

      - name: Get release tag version
        id: tag-version
        env:
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          echo "Release tag: $RELEASE_TAG"

          # Remove 'release/' prefix if present
          TAG_VERSION="${RELEASE_TAG#release/}"
          # Remove 'v' prefix if present
          TAG_VERSION="${TAG_VERSION#v}"

          echo "tag_version=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "Tag version: $TAG_VERSION"

      - name: Verify version consistency
        env:
          PACKAGE_VERSION: ${{ steps.get-version.outputs.version }}
          TAG_VERSION: ${{ steps.tag-version.outputs.tag_version }}
        run: |
          echo "Verifying versions:"
          echo "  package.json: $PACKAGE_VERSION"
          echo "  Release tag:  $TAG_VERSION"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: Version mismatch!"
            echo "  package.json has version $PACKAGE_VERSION"
            echo "  but release tag is $TAG_VERSION"
            echo "Please ensure package.json version matches the release tag."
            exit 1
          fi

          echo "✓ Version check passed: $PACKAGE_VERSION"

  build-windows:
    name: Build Windows
    needs: check-version
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows app
        run: npm run build:win

      # 成果物のファイル名は release-state.mjs の releaseAssets が唯一の定義元。
      # その一覧に従って集め、latest.yml が実際のファイルを指していることを確かめる。
      - name: Collect release assets
        shell: bash
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          ASSETS=$(node .github/scripts/release-cli.mjs assets windows)
          mkdir -p release-assets/windows
          while IFS= read -r name; do
            mv "dist/$name" "release-assets/windows/$name"
          done <<< "$ASSETS"
          node .github/scripts/release-cli.mjs verify-update-info windows release-assets/windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: release-assets/windows
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-macos:
    name: Build macOS
    needs: check-version
    runs-on: macos-latest
    steps:
      - name: Validate macOS signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for secret_name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::$secret_name is not configured"
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build, sign, and notarize macOS app
        run: npm run build:mac -- --config electron-builder.release.yml
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # 成果物のファイル名は release-state.mjs の releaseAssets が唯一の定義元。
      # その一覧に従って集め、latest-mac.yml が実際のファイルを指していることを確かめる。
      - name: Collect release assets
        id: collect
        shell: bash
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          ASSETS=$(node .github/scripts/release-cli.mjs assets macos)
          mkdir -p release-assets/macos
          while IFS= read -r name; do
            mv "dist/$name" "release-assets/macos/$name"
          done <<< "$ASSETS"
          node .github/scripts/release-cli.mjs verify-update-info macos release-assets/macos
          {
            echo "dmg=release-assets/macos/$(grep -m1 '\.dmg$' <<< "$ASSETS")"
            echo "zip=release-assets/macos/$(grep -m1 '\.zip$' <<< "$ASSETS")"
          } >> "$GITHUB_OUTPUT"

      # 手動インストール用の DMG と、自動更新で展開される ZIP の両方について、
      # 中の app のアーキテクチャ・署名・公証・Gatekeeper を確かめる。
      - name: Verify macOS app in DMG and ZIP
        shell: bash
        env:
          DMG_PATH: ${{ steps.collect.outputs.dmg }}
          ZIP_PATH: ${{ steps.collect.outputs.zip }}
        run: |
          set -euo pipefail

          MOUNT_POINT="$(mktemp -d)"
          EXTRACT_DIR="$(mktemp -d)"
          MOUNTED=0

          cleanup() {
            if [ "$MOUNTED" = 1 ]; then
              hdiutil detach "$MOUNT_POINT" || true
            fi
            rmdir "$MOUNT_POINT" || true
            rm -rf "$EXTRACT_DIR" || true
          }
          trap cleanup EXIT

          verify_app() {
            local app_path="$1"
            test -d "$app_path"
            local archs
            archs="$(lipo -archs "$app_path/Contents/MacOS/tell")"
            for arch in x86_64 arm64; do
              if [[ " $archs " != *" $arch "* ]]; then
                echo "::error::Missing $arch architecture in $app_path: $archs"
                exit 1
              fi
            done
            codesign --verify --deep --strict --verbose=2 "$app_path"
            xcrun stapler validate "$app_path"
            spctl --assess --verbose --type exec "$app_path"
          }

          test -f "$DMG_PATH"
          hdiutil attach "$DMG_PATH" -readonly -nobrowse -mountpoint "$MOUNT_POINT"
          MOUNTED=1
          test -L "$MOUNT_POINT/Applications"
          test "$(readlink "$MOUNT_POINT/Applications")" = "/Applications"
          verify_app "$MOUNT_POINT/tell.app"

          test -f "$ZIP_PATH"
          ditto -x -k "$ZIP_PATH" "$EXTRACT_DIR"
          verify_app "$EXTRACT_DIR/tell.app"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-build
          path: release-assets/macos
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # 全 OS の成果物がそろってからアップロードし、Draft なら公開する。
  # Mac App Store 向けのジョブ（#183）は Apple 側の配布なので needs に含めない。
  upload-release:
    name: Upload and Publish Release
    needs: [create-release, check-version, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # create-release と同じグループ。手動の publish と自動の実行が重なった場合も直列にする
    concurrency:
      group: release-write
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ビルドジョブごとに別のディレクトリへ展開し、片方のジョブの artifact が
      # もう片方の成果物を上書きできないようにする。
      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: windows-build
          path: release-assets/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v7
        with:
          name: macos-build
          path: release-assets/macos

      # アップロードするファイルと順序を release-state.mjs の一覧から決める（本体が先、
      # 更新情報ファイルが最後）。書き込み権限を持つこのジョブでも更新情報を検証し直す。
      - name: Resolve and verify release assets
        id: assets
        shell: bash
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          ASSETS_FILE: ${{ runner.temp }}/assets.txt
        run: |
          set -euo pipefail
          node .github/scripts/release-cli.mjs upload-list release-assets > "$ASSETS_FILE"
          for platform in windows macos; do
            node .github/scripts/release-cli.mjs verify-update-info "$platform" "release-assets/$platform"
          done
          echo "file=$ASSETS_FILE" >> "$GITHUB_OUTPUT"

      # 別の実行による付け替え・公開や、手での公開の後に古い成果物で上書きしないよう、
      # アップロードの直前に Release の状態を確かめる。
      - name: Verify release state
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MODE: ${{ needs.create-release.outputs.mode }}
          TAG: ${{ needs.create-release.outputs.tag }}
          SHA: ${{ github.sha }}
          RELEASES_FILE: ${{ runner.temp }}/releases.json
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$REPO/releases" > "$RELEASES_FILE"
          node .github/scripts/release-cli.mjs verify-upload

      # 更新情報ファイルを先に消し、本体を上げ終えてから最後に上げ直す（上げ直しの途中で
      # 古い latest*.yml が新しい本体を指して sha512 が食い違う時間を作らないため）。
      # Draft では、今回の一覧に無い古いアセットも消す。
      - name: Remove assets to be replaced
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODE: ${{ needs.create-release.outputs.mode }}
          TAG: ${{ needs.create-release.outputs.tag }}
          VERSION: ${{ needs.check-version.outputs.version }}
          EXISTING_FILE: ${{ runner.temp }}/existing-assets.txt
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets --jq '.assets[].name' > "$EXISTING_FILE"
          DELETE=$(node .github/scripts/release-cli.mjs assets-to-delete)
          while IFS= read -r name; do
            if [ -n "$name" ]; then
              gh release delete-asset "$TAG" "$name" --yes
            fi
          done <<< "$DELETE"

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
          ASSETS_FILE: ${{ steps.assets.outputs.file }}
        run: |
          set -euo pipefail
          # 本体は 1 回の呼び出しでまとめて（並列に）上げ、更新情報ファイルはその後に上げる
          mapfile -t ASSETS < "$ASSETS_FILE"
          BINARIES=()
          UPDATE_INFO=()
          for asset in "${ASSETS[@]}"; do
            if [[ "$asset" == *.yml ]]; then
              UPDATE_INFO+=("$asset")
            else
              BINARIES+=("$asset")
            fi
          done
          gh release upload "$TAG" "${BINARIES[@]}" --clobber
          gh release upload "$TAG" "${UPDATE_INFO[@]}" --clobber

      - name: Publish release
        if: steps.verify.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
          LATEST: ${{ steps.verify.outputs.latest }}
        run: gh release edit "$TAG" --draft=false --latest="$LATEST"
