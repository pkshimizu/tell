# GitHub Release の自動生成ノート（--generate-notes）の分類設定。
# PR のラベルでカテゴリを分け、バージョン更新だけのリリース PR はノートから除く。
changelog:
  exclude:
    labels:
      - release
  categories:
    - title: 新機能
      labels:
        - enhancement
    - title: 不具合修正
      labels:
        - bug
    - title: ドキュメント
      labels:
        - documentation
    - title: その他
      labels:
        - '*'
