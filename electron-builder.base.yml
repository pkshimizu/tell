# Windows / macOS 共通のパッケージ設定。
# ローカルビルドは electron-builder.yml、リリースは electron-builder.release.yml が
# このファイルを extends して差分だけを上書きする。
appId: net.noncore.tell
productName: tell
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # electron-builder の既定除外は electron-builder.{yml,yaml,...} だけなので、
  # 分割した設定ファイルが app.asar に同梱されないよう明示的に除外する。
  - '!electron-builder.*.{yml,yaml}'
asarUnpack:
  - resources/**
win:
  icon: build/icon.ico
  executableName: tell
  target:
    - target: portable
      arch:
        - x64
portable:
  artifactName: ${name}-${version}-win.${ext}
# mac.target は各派生設定で定義する。
# extends のマージは配列を「結合」するため、ここに置くと子側で上書きできず
# zip と dmg の両方が生成されてしまう。
mac:
  icon: build/icon.png
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
