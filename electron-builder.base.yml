# Windows / macOS 共通のパッケージ設定。
# ローカルビルドは electron-builder.yml、リリースは electron-builder.release.yml が
# このファイルを extends して差分だけを上書きする。
appId: net.noncore.tell
productName: tell
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # electron-builder の既定除外は electron-builder.{yml,yaml,...} だけなので、
  # 分割した設定ファイルが app.asar に同梱されないよう明示的に除外する。
  - '!electron-builder.*.{yml,yaml}'
asarUnpack:
  - resources/**
win:
  icon: build/icon.ico
  executableName: tell
  # electron-updater で自動更新できるよう、portable ではなくインストーラーで配布する
  target:
    - target: nsis
      arch:
        - x64
nsis:
  # 変更したら .github/scripts/release-state.mjs の releaseAssets も合わせる（テストで検出する）
  artifactName: ${name}-${version}-win-setup.${ext}
# mac.target は各派生設定で定義する。
# extends のマージは配列を「結合」するため、ここに置くと子側で上書きできず
# zip と dmg の両方が生成されてしまう。
mac:
  icon: build/icon.png
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
npmRebuild: false
# 更新情報ファイル（latest.yml / latest-mac.yml）とアプリ内の app-update.yml を生成するための設定。
# 実際のアップロードは CI の upload-release が行い、electron-builder 自身は publish しない（--publish never）。
# 派生設定で配列が結合されないよう、配列ではなくマッピングで書く（mac.target と同じ理由）。
publish:
  provider: github
  owner: pkshimizu
  repo: tell
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
