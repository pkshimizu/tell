# リリース用の設定（Developer ID 署名 + Apple 公証済みの Universal DMG と、自動更新用の Universal ZIP）。
# CI から `electron-builder --config electron-builder.release.yml` で指定する。
extends: electron-builder.base.yml
mac:
  # dmg は手動インストール用、zip は electron-updater による自動更新用
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  # 変更したら .github/scripts/release-state.mjs の releaseAssets も合わせる（テストで検出する）
  artifactName: ${name}-${version}-universal-mac.${ext}
  forceCodeSigning: true
  # 空文字は「CSC_LINK から取り込んだ証明書を自動検出する」の意味（null は署名しない）。
  identity: ''
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  notarize: true
# 署名・公証する成果物なので、Electron 本体は非公式ミラーではなく公式配布元から取得する。
# electron-builder 26 では .npmrc の electron_mirror がこの設定より優先されるため、CI では
# npm の CLI フラグ（--electron_mirror）でも同じ配布元を指定している（release.yml）。
electronDownload:
  mirror: https://github.com/electron/electron/releases/download/
dmg:
  # 変更したら .github/scripts/release-state.mjs の releaseAssets も合わせる（テストで検出する）
  artifactName: ${name}-${version}-universal-mac.${ext}
  # 既定の背景画像（540x380、矢印の中心が y=220）に合わせたウィンドウとアイコン配置。
  window:
    width: 540
    height: 380
  contents:
    # path 省略時はアプリ本体（tell.app）が対象になる。
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
